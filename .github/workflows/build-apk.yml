name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-apks:
    name: Assemble Release & Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (actions/setup-java@v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-accept All Android SDK Licenses Non-Interactively
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_ROOT="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          fi
          echo "Writing license hashes to $ANDROID_ROOT/licenses..."
          sudo mkdir -p "$ANDROID_ROOT/licenses"
          sudo chown -R "$USER:$USER" "$ANDROID_ROOT" || true
          
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" | sudo tee "$ANDROID_ROOT/licenses/android-sdk-license" > /dev/null
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$ANDROID_ROOT/licenses/android-sdk-preview-license" > /dev/null
          printf "\nd97546519014670786de30286e9389e80d47b534" | sudo tee "$ANDROID_ROOT/licenses/intel-android-extra-license" > /dev/null
          printf "\ne9acab5b5fbb560a72cfa4f69c30ed2d08ad5d13" | sudo tee "$ANDROID_ROOT/licenses/mips-android-sysimage-license" > /dev/null
          printf "\n601085b94cd77f0b54ff864069570991500085d7" | sudo tee "$ANDROID_ROOT/licenses/google-gdk-license" > /dev/null
          printf "\n33b6a2b64920221e4fcf8e937dcc3d65d3ac16dd" | sudo tee "$ANDROID_ROOT/licenses/android-googletv-license" > /dev/null

      - name: Set up Android SDK & Accept All Licenses
        uses: android-actions/setup-android@v3

      - name: Non-interactive sdkmanager License Acceptance & Tools Installation
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125" > /dev/null 2>&1 || true

      - name: Cache Gradle Caches & Gradle 8.9 Distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /opt/gradle/gradle-8.9
          key: ${{ runner.os }}-gradle-8.9-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.9-build-

      - name: Set up Gradle 8.9 (Multi-Mirror Resilient Download — Fixes HTTP 504 Timeout)
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.9"
          INSTALL_DIR="/opt/gradle/gradle-${GRADLE_VERSION}"

          if [ ! -x "${INSTALL_DIR}/bin/gradle" ]; then
            sudo mkdir -p /opt/gradle
            sudo chown -R "$USER:$USER" /opt/gradle
            TMP_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
            rm -f "$TMP_ZIP"

            MIRRORS=(
              "https://downloads.gradle-dn.com/distributions/gradle-${GRADLE_VERSION}-bin.zip"
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
              "https://repo.huaweicloud.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"
            )

            DOWNLOADED=0
            for URL in "${MIRRORS[@]}"; do
              if curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 -o "$TMP_ZIP" "$URL"; then
                if unzip -tq "$TMP_ZIP" >/dev/null 2>&1; then
                  DOWNLOADED=1
                  break
                fi
              fi
            done

            if [ "$DOWNLOADED" -ne 1 ]; then
              echo "::error::Failed to download Gradle ${GRADLE_VERSION} from all mirrors"
              exit 1
            fi

            unzip -q -o "$TMP_ZIP" -d /opt/gradle
            rm -f "$TMP_ZIP"
          fi

          echo "${INSTALL_DIR}/bin" >> "$GITHUB_PATH"
          "${INSTALL_DIR}/bin/gradle" --version

      - name: Prepare Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/waqar-release.jks"
          rm -f "$KEYSTORE_PATH"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEYSTORE_PATH"
            KS_PASS="${RELEASE_KEYSTORE_PASSWORD}"
            K_ALIAS="${RELEASE_KEY_ALIAS}"
            K_PASS="${RELEASE_KEY_PASSWORD}"
          else
            EPHEMERAL_PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias waqar_ci_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Waqar Computer Institute, OU=Education ERP, O=Waqar Institute, L=Lucknow, ST=UP, C=IN"
            KS_PASS="$EPHEMERAL_PASS"
            K_ALIAS="waqar_ci_release"
            K_PASS="$EPHEMERAL_PASS"
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$K_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$K_PASS" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper & Build Signed Release & Debug APKs
        working-directory: android-kotlin
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest assembleRelease assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=summary

      - name: Collect APKs for Upload
        run: |
          set -euo pipefail
          mkdir -p artifacts/release artifacts/debug
          RELEASE_APK=$(find android-kotlin/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find android-kotlin/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$RELEASE_APK" artifacts/release/WaqarInstitute-Release-Signed.apk
          cp "$DEBUG_APK" artifacts/debug/WaqarInstitute-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaqarInstitute-Release-Signed-APK
          path: artifacts/release/WaqarInstitute-Release-Signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaqarInstitute-Debug-APK
          path: artifacts/debug/WaqarInstitute-Debug.apk
          if-no-files-found: error
          retention-days: 14

name: Waqar Institute Native Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "8.9"

jobs:
  build-and-verify-android:
    name: Build, Test & Verify Native Android APK (API 35 + NDK r26b)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-Accept All Android SDK Licenses Non-Interactively
        run: |
          ANDROID_Root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$ANDROID_Root" ]; then
            ANDROID_Root="/usr/local/lib/android/sdk"
          fi
          mkdir -p "$ANDROID_Root/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_Root/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_Root/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_Root/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_Root/licenses/google-gdk-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$ANDROID_Root/licenses/mips-android-sysimage-license"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35, Build-Tools 35.0.0, CMake 3.22.1 & NDK r26b
        run: |
          SDKMANAGER=$(which sdkmanager || find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Provision Gradle ${{ env.GRADLE_VERSION }} Wrapper at Root
        run: |
          chmod +x gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading Gradle ${GRADLE_VERSION} binary distribution..."
            GRADLE_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
            for URL in \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              "https://downloads.gradle-dn.com/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"; do
              if curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 "$URL" -o "$GRADLE_ZIP"; then
                break
              fi
            done
            unzip -q "$GRADLE_ZIP" -d /tmp/gradle-dist
            /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION} --distribution-type bin --no-daemon
          fi

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Inject google-services.json (From Secret if Configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          test -f app/google-services.json

      - name: Run Unit Tests & Assemble Debug APK (Strict Verification — No Error Suppression)
        run: |
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waqar-Institute-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Release Keystore Policy on Release Tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing! Refusing to generate an ephemeral keystore for a tagged release build because Android signature mismatch breaks upgrades."
            exit 1
          fi

      - name: Decode Production Release Keystore & Assemble Signed Release APK + AAB
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          ./gradlew assembleRelease bundleRelease --stacktrace

          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          for APK in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Upload Signed Release APK & AAB Artifacts
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: Waqar-Institute-Signed-Release-Bundle
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
